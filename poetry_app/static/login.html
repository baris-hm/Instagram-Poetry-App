<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Şiirden Karelere güvenli giriş sayfası.">
    <meta name="theme-color" content="#a13d2d">
    <meta name="application-name" content="Şiirden Karelere">
    <title>Giriş · Şiirden Karelere</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/static/icons/icon-192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/pwa.js" defer></script>
  </head>
  <body class="login-body">
    <main class="login-main">
      <section class="login-card" aria-labelledby="login-title">
        <span class="brand-mark login-mark" aria-hidden="true">Ş</span>
        <p class="eyebrow">Şiirden Karelere</p>
        <h1 id="login-title">Hoş geldiniz.</h1>
        <p>Devam etmek için uygulama şifresini girin.</p>
        <p class="login-error" role="alert" {{LOGIN_ERROR_HIDDEN}}>
          Şifre doğru değil. Lütfen tekrar deneyin.
        </p>
        <form class="login-form" method="post" action="/login">
          <label for="password">Uygulama şifresi</label>
          <input id="password" name="password" type="password" required autofocus autocomplete="current-password">
          <button class="primary-button" type="submit">Giriş yap</button>
        </form>
        <small>Bu cihaz girişinizi hatırlayacaktır.</small>
        <button class="login-install-button" type="button" data-install-app hidden>
          Bu bilgisayara yükle
        </button>
      </section>
    </main>
  </body>
</html>
