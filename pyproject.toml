[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-poetry-prototype"
version = "0.1.0"
description = "A small Turkish-poem to Instagram-carousel prototype"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
poetry-carousel = "poetry_app.__main__:main"

[tool.setuptools.package-data]
poetry_app = ["static/*"]

